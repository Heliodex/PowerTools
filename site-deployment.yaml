apiVersion: apps/v1
kind: Deployment
metadata:
    annotations:
        kompose.cmd: kompose convert
        kompose.version: 1.34.0 (cbf2835db)
    labels:
        io.kompose.service: site
    name: site
spec:
    replicas: 1
    selector:
        matchLabels:
            io.kompose.service: site
    template:
        metadata:
            annotations:
                kompose.cmd: kompose convert
                kompose.version: 1.34.0 (cbf2835db)
            labels:
                io.kompose.service: site
        spec:
            containers:
                - env:
                      - name: SURREAL_URL
                        value: ws://database:8000
                  image: site
                  name: site
                  ports:
                      - containerPort: 3000
                        protocol: TCP
            restartPolicy: Always
