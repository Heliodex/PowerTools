apiVersion: apps/v1
kind: Deployment
metadata:
    annotations:
        kompose.cmd: kompose convert
        kompose.version: 1.34.0 (cbf2835db)
    labels:
        io.kompose.service: database
    name: database
spec:
    replicas: 1
    selector:
        matchLabels:
            io.kompose.service: database
    strategy:
        type: Recreate
    template:
        metadata:
            annotations:
                kompose.cmd: kompose convert
                kompose.version: 1.34.0 (cbf2835db)
            labels:
                io.kompose.service: database
        spec:
            containers:
                - args:
                      - start
                      - -l=trace
                      - -u=root
                      - -p=root
                      - surrealkv://data
                  image: surrealdb/surrealdb:v3.2.4
                  name: database
                  ports:
                      - containerPort: 8000
                        protocol: TCP
            restartPolicy: Always
