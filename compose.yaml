# Config file for compose, a tool that allows for easily managing multiple containers.
# https://docs.docker.com/compose/

services:
    database:
        # not :nightly because doing that once caused failures when graph linking
        # and also caused errors with query parameters (twice)
        image: surrealdb/surrealdb:v3.2.4
        ports:
            - 8000:8000
        restart: always
        volumes:
            - ./data:data
        command:
            - start
            - -l=trace
            - -u=root
            - -p=root
            - surrealkv://data

    site:
        build: .
        environment:
            # ws://database:8000 resolves within the Compose network to the database service, which listens on port 8000 (not the local-dev 8001)
            SURREAL_URL: ws://database:8000
        ports:
            - 3000:3000
        restart: always
        depends_on:
            - database # will keep retrying until database is ready

volumes:
    data:
        driver: local
        driver_opts:
            type: none
            device: ./data
            o: bind
